name: Build SM8150 HyperOS Kernel
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          ref: 16.0
          path: kernel
          fetch-tags: false

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git flex bison gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev libelf-dev make zip

      - name: Download crDroid Clang
        run: |
          git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547694.git clang

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          cd kernel
          make clean && make mrproper
          make oneplus_defconfig
          make -j$(nproc)
